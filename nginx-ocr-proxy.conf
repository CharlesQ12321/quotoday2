# ========================================
# 每日一签 - OCR API 反向代理配置
# 使用方法：将此配置添加到 server 块中
# ========================================

location /api/ocr {
    # 代理到智谱AI GLM-4V API
    proxy_pass https://open.bigmodel.cn/api/paas/v4/chat/completions;

    # 注入API Key（替换为你的实际密钥）
    proxy_set_header Authorization "Bearer 434f06f4712b4721b9256576bed72f58.Ri4CcwszHI9iiCpI";

    # 基础代理头
    proxy_set_header Content-Type "application/json";
    proxy_set_header Host open.bigmodel.cn;

    # 超时设置（OCR识别可能需要较长时间）
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 30s;

    # 请求体大小限制（图片Base64可能较大）
    client_max_body_size 20m;
}