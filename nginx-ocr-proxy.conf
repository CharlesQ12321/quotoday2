# ========================================
# 每日一签 - OCR API 反向代理配置
# 使用方法：将此配置添加到 server 块中
# ========================================

location /api/ocr {
    # 代理到阿里云MaaS API（OpenAI兼容格式）
    proxy_pass https://llm-hu0rqv0mj8b9rakc.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions;

    # 注入API Key
    proxy_set_header Authorization "Bearer sk-ws-H.ERPIEXX.have.MEUCIQD5q3TYK1qRBkFX8hHWVNkoUOmLDNrU9iRSymMGTgZOkAIgZ2fjl6m6_S7-5sfrR8BdZQbpn5cQWeRIyp8TvBli078";

    # 基础代理头
    proxy_set_header Content-Type "application/json";
    proxy_set_header Host llm-hu0rqv0mj8b9rakc.cn-beijing.maas.aliyuncs.com;

    # 超时设置（OCR识别可能需要较长时间）
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 30s;

    # 请求体大小限制（图片Base64可能较大）
    client_max_body_size 20m;
}